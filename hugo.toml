baseURL = "https://fixit-student.pages.dev/"
locale = "vi"
defaultContentLanguage = "vi"
title = "FixIT Student"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  slogan = "Máy tính gặp lỗi? Để tụi mình xem giúp."
  tagline = "Hỗ trợ cài đặt môi trường lập trình, xử lý sự cố máy tính và tư vấn công nghệ dành cho sinh viên."
  email = "fixit.student@example.com"
  zalo = "Zalo FixIT Student (demo)"
  facebook = "facebook.com/fixit.student (demo)"
  hours = "Thứ 2 – Thứ 6: 17:00 – 19:30 · Thứ 7: 08:30 – 11:30"
  meetingPoint = "Sảnh trường ĐH KHTN CS1 & CS2"
  packPrice = 149000

# Trang chủ xuất thêm services.json để Find your fix / giỏ hàng dùng
[outputFormats]
  [outputFormats.ServicesJSON]
    mediaType = "application/json"
    baseName = "services"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "ServicesJSON"]

[menu]
  [[menu.main]]
    name = "Trang chủ"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Dịch vụ & Bảng giá"
    url = "/services/"
    weight = 2
  [[menu.main]]
    name = "Tìm lỗi máy tính"
    url = "/find-your-fix/"
    weight = 3
  [[menu.main]]
    name = "Student Pack"
    url = "/student-pack/"
    weight = 4
  [[menu.main]]
    name = "Giới thiệu"
    url = "/about/"
    weight = 5
  [[menu.main]]
    name = "Liên hệ"
    url = "/contact/"
    weight = 6
